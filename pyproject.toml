[project]
name = "watchai-teleop"
version = "0.1.0"
description = "IMU-based teleoperation for imitation learning using Apple Watch"
requires-python = ">=3.10"
dependencies = [
    "robosuite>=1.5",
    "mujoco>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
training = [
    "torch>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
